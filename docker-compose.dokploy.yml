# docker-compose.dokploy.yml — production stack for self-hosted Dokploy.
#
# The production target for backend + GOWA bridge (Coolify is abandoned as of
# 2026-09-26; docker-compose.coolify.yml is not used). Read
# ops/DOKPLOY_DEPLOY.md before deploying; its pre-flight checklist is not
# optional.
#
# Deploy shape:
#   Dokploy -> Project -> Create Service -> Compose
#   Repository : mybijouai-creator/bijou-monorepo
#   Branch     : main
#   Compose    : docker-compose.dokploy.yml
#   Env        : paste ops/dokploy/dokploy.env.example, fill in real values
#
# Dokploy runs Traefik and attaches it to the external `dokploy-network`.
# Services that need a public hostname join that network and carry Traefik
# labels. Services that must NOT be publicly reachable (the bridge) stay on
# the internal network only and publish no ports.
#
# WHAT IS DELIBERATELY NOT HERE
#   - No Postgres. Supabase (cloud) remains the database.
#   - No Langfuse stack. Run it as its own Dokploy service if you want it; do
#     not hand it the database key.

networks:
  dokploy-network:
    external: true
  internal:
    driver: bridge

volumes:
  backend-uploads:
  bridge-data:

# Only what the backend genuinely needs. No shared anchor across unrelated
# services — that is how the Langfuse containers ended up holding the
# service-role key.
x-backend-core: &backend-core
  SUPABASE_URL: "${SUPABASE_URL:?set SUPABASE_URL}"
  SUPABASE_SERVICE_KEY: "${SUPABASE_SERVICE_KEY:?set SUPABASE_SERVICE_KEY}"
  # Read with no default at 15 call sites (e.g. src/connectors/nango_api.py:35).
  # Same value as SUPABASE_SERVICE_KEY; omitting it produces None-typed crashes
  # at first use rather than at startup.
  SUPABASE_KEY: "${SUPABASE_SERVICE_KEY:?set SUPABASE_SERVICE_KEY}"
  # AI. All Gemini keys were revoked 2026-09-26, so Gemini is NOT required;
  # every alias except ai://private falls through to MiniMax
  # (packages/backend/llm_gateway.yaml). MINIMAX_API_KEY is the one live key,
  # and a deploy with no AI key would answer every customer with an apology,
  # so it is `:?`. ai://private is strict-privacy (gemini/openai only) and
  # needs OPENAI_API_KEY to work at all.
  MINIMAX_API_KEY: "${MINIMAX_API_KEY:?set MINIMAX_API_KEY}"
  OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
  OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
  AI_GATEWAY_API_KEY: "${AI_GATEWAY_API_KEY:-}"
  GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
  # The canonical origin. Everything user-facing is built from this.
  # NEVER also set LOGIN_URL / APP_URL / DASHBOARD_URL / GOOGLE_REDIRECT_URI —
  # each is read before the PUBLIC_URL-derived fallback, so a stale value
  # silently wins and sessions break. See ops/DOKPLOY_DEPLOY.md § Domains.
  PUBLIC_URL: "${PUBLIC_URL:?set PUBLIC_URL, e.g. https://app.mybijou.xyz}"
  # REQUIRED, and pinned rather than left to an env var, because getting it
  # wrong loses data silently. BijouAI._init_database (src/core/bijou.py:2035)
  # calls _init_supabase() only when DB_TYPE == "supabase"; unset defaults to
  # "sqlite" and persists to /data/bijou.db in ephemeral container storage
  # while the dashboard keeps reading Supabase. Documented in no .env.example
  # and no compose file before 2026-09-06 — found by booting the stack.
  DB_TYPE: "supabase"
  # REQUIRED. Shared secret authenticating the bridge -> backend /webhook/*
  # calls, which had no authentication at all before 2026-09-06. It is `:?` on
  # purpose: a NEW deploy must not be able to come up in the fail-open state
  # that exists only as a migration path for already-running instances.
  BIJOU_WEBHOOK_SECRET: "${BIJOU_WEBHOOK_SECRET:?set BIJOU_WEBHOOK_SECRET (openssl rand -hex 32)}"
  ENVIRONMENT: "production"
  LOG_LEVEL: "${LOG_LEVEL:-INFO}"

services:
  backend:
    build:
      context: .
      dockerfile: ops/dokploy/Dockerfile.backend.dokploy
    image: bijou-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks: [dokploy-network, internal]
    # Every variable set in Dokploy's Environment tab (written to .env when
    # createEnvFile is on) reaches the app: feature flags like
    # ENABLE_MORNING_BRIEF / ENABLE_OWNER_APPROVALS / ENABLE_OUTREACH_SCHEDULER
    # are read straight from os.environ. Unset vars stay unset, so code
    # defaults apply. The explicit `environment:` block below still wins.
    env_file:
      - path: .env
        required: false
    environment:
      <<: *backend-core
      PORT: "8080"
      # Each worker imports the whole app. Keep workers x footprint under
      # BACKEND_MEM_LIMIT. See ops/DOKPLOY_DEPLOY.md § Resources.
      WEB_CONCURRENCY: "${WEB_CONCURRENCY:-2}"
      # BOTH names, same value. ~30 call sites read BRIDGE_URL only, including
      # the reply sender (src/core/bijou.py self.bridge_url, default
      # localhost:8080 = the backend itself) and several that default to a Fly
      # bridge. With only WHATSAPP_BRIDGE_URL set, QR onboarding works but
      # replies never reach WhatsApp. fly.production.toml sets both too.
      WHATSAPP_BRIDGE_URL: "http://bridge:3000"
      BRIDGE_URL: "http://bridge:3000"
      BRIDGE_USER: "${BRIDGE_USER:?set BRIDGE_USER}"
      BRIDGE_PASSWORD: "${BRIDGE_PASSWORD:?set BRIDGE_PASSWORD}"
      ADMIN_API_KEY: "${ADMIN_API_KEY:?set ADMIN_API_KEY}"
      DATA_REQUEST_SIGNING_KEY: "${DATA_REQUEST_SIGNING_KEY:?set DATA_REQUEST_SIGNING_KEY}"
      # Billing must work, so the four values checkout + webhook cannot run
      # without are `:?`. src/saas/payment_api.py: POST /api/payment/checkout
      # reads STRIPE_PRICE_<PLAN>_<MONTHLY|YEARLY> at request time (unset =
      # hardcoded fallback ids of unknown mode); POST /api/payment/webhook
      # rejects everything when STRIPE_WEBHOOK_SECRET is unset.
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:?set STRIPE_SECRET_KEY}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:?set STRIPE_WEBHOOK_SECRET (whsec_... from the Dokploy-domain endpoint)}"
      STRIPE_PRICE_PRO_MONTHLY: "${STRIPE_PRICE_PRO_MONTHLY:?set STRIPE_PRICE_PRO_MONTHLY}"
      STRIPE_PRICE_PRO_YEARLY: "${STRIPE_PRICE_PRO_YEARLY:?set STRIPE_PRICE_PRO_YEARLY}"
      STRIPE_PRICE_GROWTH_MONTHLY: "${STRIPE_PRICE_GROWTH_MONTHLY:-}"
      STRIPE_PRICE_GROWTH_YEARLY: "${STRIPE_PRICE_GROWTH_YEARLY:-}"
      STRIPE_PUBLISHABLE_KEY: "${STRIPE_PUBLISHABLE_KEY:-}"
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      FROM_EMAIL: "${FROM_EMAIL:-}"
      FROM_NAME: "${FROM_NAME:-}"
      CALCOM_CLIENT_ID: "${CALCOM_CLIENT_ID:-}"
      CALCOM_CLIENT_SECRET: "${CALCOM_CLIENT_SECRET:-}"
      NANGO_SECRET_KEY: "${NANGO_SECRET_KEY:-}"
      NANGO_HOST: "${NANGO_HOST:-}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      ENABLE_COMPOSIO: "false"
      LANGFUSE_ENABLED: "${LANGFUSE_ENABLED:-false}"
      LANGFUSE_PUBLIC_KEY: "${LANGFUSE_PUBLIC_KEY:-}"
      LANGFUSE_SECRET_KEY: "${LANGFUSE_SECRET_KEY:-}"
      LANGFUSE_HOST: "${LANGFUSE_HOST:-}"
    volumes:
      - backend-uploads:/app/uploads
    healthcheck:
      # /health/database, NOT /health and NOT /api/self-test/summary.
      #   /health                  returns 200 with the DB completely
      #                            unreachable — verified 2026-09-05, so it
      #                            cannot signal a broken deploy and defeats
      #                            rollback entirely.
      #   /api/self-test/summary   times out (measured 000 against a 10s
      #                            timeout).
      test: ["CMD-SHELL", "curl -fsS --max-time 8 http://127.0.0.1:8080/health/database || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: ${BACKEND_MEM_LIMIT:-2G}
        reservations:
          memory: 512M
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.bijou-backend.rule=Host(`${BACKEND_DOMAIN:?set BACKEND_DOMAIN}`)"
      - "traefik.http.routers.bijou-backend.entrypoints=websecure"
      - "traefik.http.routers.bijou-backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.bijou-backend.loadbalancer.server.port=8080"
      # Terminating TLS at Traefik means the app sees plain http. Without
      # these the app can build http:// URLs for an https:// site.
      - "traefik.http.middlewares.bijou-backend-proto.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.routers.bijou-backend.middlewares=bijou-backend-proto"

  # GOWA — the bridge the backend actually speaks to.
  #
  # NOT packages/bridge. That is the older Go/whatsmeow bridge and the repo's
  # own source says it is not what runs in production
  # (src/saas/onboarding_api.py:576); fly.bridge-production.toml:5 deploys this
  # image. They speak different APIs — packages/bridge exposes /qr and
  # /api/init, the backend calls /devices and /app/login — so shipping the
  # wrong one means the WhatsApp QR step can never work.
  #
  # Verified against the real image before this change:
  #   POST /devices               -> results.id
  #   GET  /app/login?device_id=… -> results.qr_link
  #   GET  /api/onboarding/qr/{token} through the backend -> 200 image/png,
  #        a genuine 512x512 scannable QR.
  bridge:
    # Pinned by digest. This is an unofficial WhatsApp Web client; an
    # unattended :latest upgrade can break every tenant's session at once.
    image: aldinokemal2104/go-whatsapp-web-multidevice@sha256:2b942792de76be3940e507507f24b50012e4b4048f31a2eb2380f1d01ca3a9f0
    restart: unless-stopped
    # internal ONLY — no ports, no Traefik labels. The bridge holds every
    # tenant's WhatsApp session; it has no business being reachable publicly.
    networks: [internal]
    depends_on:
      backend:
        condition: service_healthy
    command:
      - rest
      - --port=3000
      # Parity with the live Fly bridge's [env]
      # (packages/bridge/fly.bridge-production.toml). Flags confirmed present
      # in this digest's `rest --help`.
      - --os=BijouAI-Production
      - --auto-download-media=true
      - --auto-mark-read=false
      - --auto-reject-call=true
      - --webhook-events=message,message.ack,group.participants
      # GOWA signs the webhook BODY (X-Hub-Signature-256: sha256=<hmac>) rather
      # than sending the secret in a header. _verify_webhook_secret in
      # src/core/bijou.py verifies that form.
      - --webhook=http://backend:8080/webhook/message
      - --webhook-secret=${BIJOU_WEBHOOK_SECRET:?set BIJOU_WEBHOOK_SECRET (openssl rand -hex 32)}
      - --basic-auth=${BRIDGE_USER:?set BRIDGE_USER}:${BRIDGE_PASSWORD:?set BRIDGE_PASSWORD}
      - --db-uri=file:/app/storages/whatsapp.db?_foreign_keys=on
    volumes:
      # Every tenant's WhatsApp session lives here. Losing this volume forces a
      # QR re-scan for ALL tenants — back it up.
      - bridge-data:/app/storages
    healthcheck:
      # Credentials in the URL: this image ships busybox wget, which does not
      # implement --user/--password. /devices needs no device context;
      # /app/login 400s with DEVICE_ID_REQUIRED so it is not a liveness probe.
      test: ["CMD-SHELL", "wget -q --spider http://${BRIDGE_USER}:${BRIDGE_PASSWORD}@127.0.0.1:3000/devices || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: ${BRIDGE_MEM_LIMIT:-512M}

  landing:
    build:
      context: .
      dockerfile: Dockerfile.landing
    image: bijou-landing:${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks: [dokploy-network]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    profiles: ["landing"]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.bijou-landing.rule=Host(`${LANDING_DOMAIN:-landing.invalid}`)"
      - "traefik.http.routers.bijou-landing.entrypoints=websecure"
      - "traefik.http.routers.bijou-landing.tls.certresolver=letsencrypt"
      - "traefik.http.services.bijou-landing.loadbalancer.server.port=3000"

  voice:
    build:
      context: .
      dockerfile: packages/voice/Dockerfile.voice
    image: bijou-voice:${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks: [dokploy-network, internal]
    depends_on:
      backend:
        condition: service_healthy
    environment:
      <<: *backend-core
      PORT: "8100"
      WEB_CONCURRENCY: "${VOICE_CONCURRENCY:-2}"
      BIJOU_BACKEND_URL: "http://backend:8080"
      TELNYX_API_KEY: "${TELNYX_API_KEY:-}"
      TELNYX_PUBLIC_KEY: "${TELNYX_PUBLIC_KEY:-}"
      TELNYX_WEBHOOK_SECRET: "${TELNYX_WEBHOOK_SECRET:-}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 5 http://127.0.0.1:8100/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    profiles: ["voice"]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.bijou-voice.rule=Host(`${VOICE_DOMAIN:-voice.invalid}`)"
      - "traefik.http.routers.bijou-voice.entrypoints=websecure"
      - "traefik.http.routers.bijou-voice.tls.certresolver=letsencrypt"
      - "traefik.http.services.bijou-voice.loadbalancer.server.port=8100"
