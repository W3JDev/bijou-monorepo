[pytest]
# Pytest Configuration for Bijou AI Test Suite
# ==============================================

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Console output options
console_output_style = progress
addopts =
    -v
    --strict-markers
    --tb=short
    --color=yes
    -ra
    --disable-warnings

# Markers for test organization
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, with dependencies)
    e2e: End-to-end tests (slowest, full stack)
    smoke: Smoke tests (critical paths only, run first)
    slow: Tests that take >5 seconds
    asyncio: Async tests
    load: Load and performance tests
    security: Security vulnerability tests
    regression: Regression tests (DO NOT DELETE)
    critical: CRITICAL tests that BLOCK deployment if they fail
    voice: Voice note processing tests
    media: Image and document processing tests

# Asyncio configuration
asyncio_mode = auto

# Coverage options (if pytest-cov is installed)
# Run with: pytest --cov=src --cov-report=html
# addopts = --cov=src --cov-report=term-missing

# Logging
log_cli = false
log_cli_level = INFO
log_file = tests/logs/pytest.log
log_file_level = DEBUG

# Timeout for slow tests (if pytest-timeout is installed)
# timeout = 300

# Parallel execution (if pytest-xdist is installed)
# Run with: pytest -n auto
# addopts = -n auto
