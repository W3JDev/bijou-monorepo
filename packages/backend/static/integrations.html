<!DOCTYPE html>
<html lang="en">
  <!-- edge-cache-bust:v=2026-07-28a -->
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bijou · Connect Apps</title>
  <style>
    :root { --bg:#0a0f0d; --panel:#111917; --border:#1f2c28; --emerald:#10b981; --emerald-2:#0d9488; --gold:#d4af37; --text:#e6efec; --muted:#8aa39b; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:#e6efec; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
    .wrap { max-width: 820px; margin: 0 auto; padding: 32px 20px 64px; }
    h1 { font-size: 26px; margin: 0 0 4px; }
    .sub { color:#8aa39b; margin: 0 0 28px; font-size: 14px; }
    .banner { background:#3a1d1d; border:1px solid #6b2b2b; color:#f3c9c9; padding:10px 14px; border-radius:10px; font-size:13px; margin-bottom:20px; display:none; }
    .grid { display:grid; grid-template-columns: repeat(auto-fill,minmax(240px,1fr)); gap:14px; }
    .card { background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:18px; display:flex; flex-direction:column; gap:12px; }
    .card h3 { margin:0; font-size:16px; text-transform:capitalize; }
    .status { font-size:12px; font-weight:600; padding:3px 9px; border-radius:999px; align-self:flex-start; }
    .status.ACTIVE { background:rgba(16,185,129,.15); color:var(--emerald); }
    .status.INITIATED,.status.PENDING { background:rgba(212,175,55,.15); color:var(--gold); }
    .status.EXPIRED,.status.FAILED,.status.NONE,.status.ERROR { background:rgba(180,80,80,.15); color:#e78b8b; }
    button { cursor:pointer; border:none; border-radius:10px; padding:10px 14px; font-weight:600; font-size:14px;
             background:linear-gradient(135deg,var(--emerald),var(--emerald-2)); color:#04120d; transition:opacity .15s; }
    button:hover { opacity:.9; }
    button:disabled { opacity:.5; cursor:default; }
    .empty { color:#8aa39b; padding:40px 0; text-align:center; }
    .foot { margin-top:28px; font-size:12px; color:#5f746d; }
    a { color:var(--emerald); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Connect your apps</h1>
    <p class="sub">Let Bijou act in your tools. Connect an account and Bijou can use it on your behalf.</p>
    <div id="banner" class="banner"></div>
    <div id="grid" class="grid"><div class="empty">Loading available integrations…</div></div>
    <p class="foot">Powered by a provider-agnostic connector layer — connections are optional and can be revoked anytime.</p>
  </div>

  <script>
    // Same tenant/session convention as dashboard.html.
    const params = new URLSearchParams(location.search);
    const TENANT_ID = localStorage.getItem("tenant_id") || params.get("tenant_id") || params.get("tenantId") || "";
    const ACCESS_TOKEN = localStorage.getItem("access_token") || "";
    const PENDING_KEY = "composio_pending_connection";

    // Server derives tenant from the session; we send the JWT (+ tenant hint for
    // the strict cross-check), never a client-authoritative tenant_id in the body.
    function authHeaders(extra) {
      const h = Object.assign({}, extra || {});
      if (ACCESS_TOKEN) h["Authorization"] = "Bearer " + ACCESS_TOKEN;
      if (TENANT_ID) h["X-Tenant-ID"] = TENANT_ID;
      return h;
    }

    function showBanner(msg) {
      const b = document.getElementById("banner");
      b.textContent = msg; b.style.display = "block";
    }

    // Pretty labels for toolkit slugs.
    const LABELS = {
      googlesheets:"Google Sheets", googlecalendar:"Google Calendar", googledrive:"Google Drive",
      googledocs:"Google Docs", googletasks:"Google Tasks", linkedin:"LinkedIn", instagram:"Instagram",
    };

    async function loadToolkits() {
      const grid = document.getElementById("grid");
      if (!TENANT_ID) { showBanner("No tenant session found — open this page from your dashboard."); }
      let toolkits = [];
      try {
        const res = await fetch("/connectors/toolkits");
        if (!res.ok) throw new Error("HTTP " + res.status);
        toolkits = (await res.json()).toolkits || [];
      } catch (e) {
        grid.innerHTML = '<div class="empty">Couldn\'t load integrations right now. Try again later.</div>';
        return;
      }
      if (!toolkits.length) {
        grid.innerHTML = '<div class="empty">No integrations are configured yet.</div>';
        return;
      }
      grid.innerHTML = "";
      const pending = JSON.parse(localStorage.getItem(PENDING_KEY) || "null");
      for (const tk of toolkits) {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML =
          `<h3>${LABELS[tk] || tk}</h3>` +
          `<span class="status NONE" id="status-${tk}">Not connected</span>` +
          `<button id="btn-${tk}">Connect</button>`;
        grid.appendChild(card);
        card.querySelector("button").addEventListener("click", () => connect(tk));
      }
      // If we just came back from an OAuth round-trip, resume polling.
      if (pending && pending.connection_id) pollStatus(pending.toolkit, pending.connection_id);
    }

    async function connect(toolkit) {
      const btn = document.getElementById("btn-" + toolkit);
      btn.disabled = true; btn.textContent = "Starting…";
      try {
        const res = await fetch("/connectors/initiate", {
          method: "POST",
          headers: authHeaders({ "Content-Type": "application/json" }),
          body: JSON.stringify({ toolkit }),
        });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        localStorage.setItem(PENDING_KEY, JSON.stringify({ toolkit, connection_id: data.connection_id }));
        // Send the customer to the provider's consent screen; they return to this page.
        window.location.href = data.redirect_url;
      } catch (e) {
        btn.disabled = false; btn.textContent = "Connect";
        showBanner("Couldn't start the connection. Please try again.");
      }
    }

    async function pollStatus(toolkit, connectionId, tries = 0) {
      const badge = document.getElementById("status-" + toolkit);
      try {
        const res = await fetch("/connectors/status/" + encodeURIComponent(connectionId), { headers: authHeaders() });
        const data = await res.json();
        const state = (data.status || "UNKNOWN").toUpperCase();
        if (badge) { badge.textContent = state === "ACTIVE" ? "Connected" : state; badge.className = "status " + state; }
        if (state === "ACTIVE") { localStorage.removeItem(PENDING_KEY); return; }
        if (["FAILED","EXPIRED","ERROR","REVOKED"].includes(state)) { localStorage.removeItem(PENDING_KEY); return; }
      } catch (e) { /* transient — keep trying */ }
      if (tries < 20) setTimeout(() => pollStatus(toolkit, connectionId, tries + 1), 3000);
    }

    loadToolkits();
  </script>
</body>
</html>
