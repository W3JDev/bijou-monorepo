<!doctype html>
<html lang="en">
  <!-- edge-cache-bust:v=2026-07-28a -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password - Bijou AI</title>
    <link rel="icon" type="image/png" href="/static/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #0a1e1c;
        font-family: "Inter", sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      body::before {
        content: "";
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 600px;
        height: 600px;
        background: radial-gradient(
          circle,
          rgba(46, 241, 157, 0.06) 0%,
          transparent 70%
        );
        pointer-events: none;
        z-index: 0;
      }

      .reset-card {
        background: #0a1e1c;
        border: 2px solid #c9a961;
        border-radius: 16px;
        padding: 48px 40px;
        width: 440px;
        box-shadow:
          0 0 40px rgba(0, 0, 0, 0.6),
          0 0 80px rgba(46, 241, 157, 0.08);
        position: relative;
        z-index: 1;
      }

      .logo-img {
        width: 80px;
        height: 80px;
        margin: 0 auto 24px;
        display: block;
        /* No filter — keep logo transparent on dark card */
      }

      h1 {
        color: #e8d4a0;
        font-size: 26px;
        font-weight: 700;
        text-align: center;
        margin-bottom: 8px;
        text-shadow: 0 0 10px rgba(232, 212, 160, 0.3);
      }

      .subtitle {
        color: #d0d0d0;
        font-size: 14px;
        text-align: center;
        margin-bottom: 32px;
      }

      .form-group {
        margin-bottom: 20px;
        text-align: left;
      }

      label {
        color: #e8d4a0;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.5px;
        display: block;
        margin-bottom: 8px;
        text-transform: uppercase;
      }

      input[type="password"] {
        width: 100%;
        background: #053b35;
        border: 1px solid rgba(201, 169, 97, 0.35);
        color: #ffffff;
        border-radius: 8px;
        padding: 12px 16px;
        font-size: 15px;
        font-family: "Inter", sans-serif;
        transition: all 0.2s ease;
      }

      input[type="password"]:focus {
        border-color: #2ef19d;
        outline: none;
        box-shadow: 0 0 0 3px rgba(46, 241, 157, 0.1);
        background: #064540;
      }

      input[type="password"]::placeholder {
        color: rgba(208, 208, 208, 0.6);
      }

      .btn-primary {
        width: 100%;
        background: linear-gradient(135deg, #2ef19d 0%, #00f5e4 100%);
        border: 2px solid #c9a961;
        color: #0a1e1c;
        font-family: "Inter", sans-serif;
        font-weight: 700;
        font-size: 16px;
        padding: 14px;
        border-radius: 8px;
        cursor: pointer;
        box-shadow: 0 4px 20px rgba(46, 241, 157, 0.25);
        transition: all 0.2s ease;
        margin-top: 20px;
      }

      .btn-primary:hover {
        box-shadow: 0 6px 28px rgba(46, 241, 157, 0.4);
        transform: translateY(-1px);
        background: linear-gradient(135deg, #00f5e4 0%, #2ef19d 100%);
      }

      .btn-primary:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
      }

      .status-message {
        margin-top: 20px;
        padding: 15px;
        border-radius: 10px;
        font-size: 14px;
        text-align: left;
        display: none;
        border: 1px solid transparent;
      }

      .status-message.success {
        background: rgba(46, 241, 157, 0.1);
        color: #2ef19d;
        border-color: rgba(46, 241, 157, 0.3);
        display: block;
      }

      .status-message.error {
        background: rgba(255, 67, 67, 0.1);
        color: #ff6b6b;
        border-color: rgba(255, 67, 67, 0.3);
        display: block;
      }

      .loader {
        border: 3px solid rgba(46, 241, 157, 0.3);
        border-top: 3px solid #2ef19d;
        border-radius: 50%;
        width: 20px;
        height: 20px;
        animation: spin 1s linear infinite;
        display: inline-block;
        margin-left: 10px;
        vertical-align: middle;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      .back-link {
        color: #d0d0d0;
        font-size: 14px;
        text-align: center;
        margin-top: 30px;
        padding-top: 20px;
        border-top: 1px solid rgba(201, 169, 97, 0.15);
      }

      .back-link a {
        color: #2ef19d;
        text-decoration: none;
        font-weight: 600;
        transition: color 0.2s ease;
      }

      .back-link a:hover {
        color: #00f5e4;
        text-decoration: underline;
      }

      .password-requirements {
        font-size: 12px;
        color: #c9a961;
        margin-top: 6px;
        line-height: 1.6;
      }

      @media (max-width: 480px) {
        .reset-card {
          padding: 32px 24px;
          width: 100%;
          max-width: 400px;
        }

        h1 {
          font-size: 22px;
        }

        .logo-img {
          width: 70px;
          height: 70px;
        }
      }
    </style>
  </head>
  <body>
    <div class="reset-card">
      <img
        src="/static/logos/mark.svg"
        alt="Bijou AI"
        class="logo-img"
      />
      <h1>Reset Your Password</h1>
      <p class="subtitle">Enter your new password below</p>

      <form id="resetForm">
        <div class="form-group">
          <label for="newPassword">New Password</label>
          <input
            type="password"
            id="newPassword"
            placeholder="Enter new password"
            required
            autocomplete="new-password"
          />
          <div class="password-requirements">
            At least 8 characters recommended
          </div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm new password"
            required
            autocomplete="new-password"
          />
        </div>

        <button type="submit" class="btn-primary" id="submitBtn">
          Reset Password
        </button>
      </form>

      <div id="statusMessage" class="status-message"></div>

      <div class="back-link">
        <a href="/login">Back to Login</a>
      </div>
    </div>

    <script>
      const form = document.getElementById("resetForm");
      const newPasswordInput = document.getElementById("newPassword");
      const confirmPasswordInput = document.getElementById("confirmPassword");
      const submitBtn = document.getElementById("submitBtn");
      const statusMessage = document.getElementById("statusMessage");

      // Read tokens from URL hash IMMEDIATELY before anything clears it
      const _hp = new URLSearchParams(window.location.hash.substring(1));
      const RECOVERY_TOKEN = _hp.get("access_token") || "";
      const RECOVERY_REFRESH = _hp.get("refresh_token") || "";
      const RECOVERY_TYPE = _hp.get("type") || "";

      // Clear hash from URL bar
      if (RECOVERY_TOKEN)
        history.replaceState(null, "", window.location.pathname);

      window.addEventListener("load", () => {
        if (RECOVERY_TYPE === "recovery" && RECOVERY_TOKEN) {
          showMessage(
            "info",
            "✅ Recovery link verified. Enter your new password below.",
          );
        } else {
          showMessage(
            "error",
            "❌ Invalid or expired recovery link. Please request a new password reset.",
          );
          submitBtn.disabled = true;
        }
      });

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const newPassword = newPasswordInput.value;
        const confirmPassword = confirmPasswordInput.value;

        if (newPassword.length < 8)
          return showMessage(
            "error",
            "Password must be at least 8 characters.",
          );
        if (newPassword !== confirmPassword)
          return showMessage("error", "Passwords do not match.");

        submitBtn.disabled = true;
        submitBtn.innerHTML = 'Resetting... <span class="loader"></span>';
        statusMessage.style.display = "none";

        try {
          // Call our own backend — supabaseClient.auth.updateUser() fails here
          // because it needs a persisted client session, not a raw recovery token.
          const res = await fetch("/api/auth/change-password", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: "Bearer " + RECOVERY_TOKEN,
            },
            body: JSON.stringify({ new_password: newPassword }),
          });
          const data = await res.json();
          if (!res.ok)
            throw new Error(
              data.detail || data.message || "Error " + res.status,
            );

          // Persist tokens so dashboard auto-logs in
          localStorage.setItem("access_token", RECOVERY_TOKEN);
          if (RECOVERY_REFRESH)
            localStorage.setItem("refresh_token", RECOVERY_REFRESH);

          showMessage("success", "✅ Password set! Redirecting to dashboard…");
          setTimeout(() => {
            window.location.href = "/dashboard";
          }, 2000);
        } catch (err) {
          console.error("Password reset error:", err);
          showMessage(
            "error",
            "❌ " + (err.message || "Failed to reset password."),
          );
          submitBtn.disabled = false;
          submitBtn.innerHTML = "Reset Password";
        }
      });

      function showMessage(type, message) {
        statusMessage.className = "status-message " + type;
        statusMessage.innerHTML = message;
        statusMessage.style.display = "block";
      }
    </script>
  </body>
</html>
