# =============================================================================
# Bijou AI Gateway — Stable Alias Configuration
# =============================================================================
# This file is the single source of truth for which model answers which kind of
# request. NO Python file should hardcode a model or provider name. New features
# call `await llm.complete("ai://fast", messages, ...)` — never a provider.
#
# Schema (per alias):
#   primary:           { provider, model, max_output_tokens, temperature }
#   fallbacks:         ordered list — tried only if primary 429/500/502/503/504
#   privacy:           "standard" (any provider OK) | "strict" (no OpenRouter /
#                      free pools — PDPA-sensitive prompts only hit paid/private
#                      providers we control)
#   daily_budget_usd:  platform-wide soft cap, summed across ALL tenants. Once
#                      daily spend exceeds this, the alias starts returning 429
#                      BudgetExceeded (scope="alias") with Retry-After.
#   per_tenant_daily_budget_usd:
#                      soft cap for a SINGLE tenant within the platform cap.
#                      Stops one runaway tenant eating everyone else's AI —
#                      that tenant gets 429 BudgetExceeded (scope="tenant")
#                      while every other tenant keeps working. Omit it and the
#                      gateway derives one (budget_defaults.per_tenant_fraction
#                      of the platform cap); set it to 0 to explicitly opt out.
#   description:       human-readable purpose (shown in /api/llm/aliases)
#
# Privacy levels:
#   - strict:   Primary + fallbacks must BOTH be on the strict-providers list
#               (gemini direct + openai direct). OpenRouter and MiniMax are NEVER
#               used. For PDPA-grade customer PII.
#   - standard: OpenRouter and free-pool providers are allowed as fallbacks.
#               For normal conversation, lead capture, KB lookups.
#
# Cost fields:
#   cost_per_1k_input_usd / cost_per_1k_output_usd — used by llm_gateway_v2 to
#   log `cost_usd` to the llm_usage table. Set to 0.0 when unknown.
#
# Adding a new provider:
#   1. Implement its adapter in llm_gateway_v2._PROVIDER_DISPATCH.
#   2. Reference it by `provider: <name>` in any alias below.
#   3. Add its env-var name to the provider's env_keys list (the gateway reads
#      keys from os.environ and gracefully degrades when missing).
#
# Adding a new alias:
#   Copy any block below, change the key (the `ai://...` string), pick primary +
#   fallbacks, set budget. New code calls `await llm.complete("ai://your-new",
#   messages)`. No code changes needed in the gateway — it's data-driven.
# =============================================================================

# =============================================================================
# Budget defaults — applied to any alias that does not name its own value.
# =============================================================================
budget_defaults:
  # Share of an alias's platform-wide cap a single tenant may spend per day when
  # the alias declares no per_tenant_daily_budget_usd. 0.2 means the fifth
  # concurrent runaway tenant is the first that can exhaust the platform cap.
  per_tenant_fraction: 0.2

# MODEL PINS — read before changing one (2026-09-07)
#
# Every alias pinned `gemini-2.5-flash` and every call 404'd:
#
#   "This model models/gemini-2.5-flash is no longer available to new users.
#    Please update your code to use models/gemini-3.6-flash"
#
# 2.5-flash is still LISTED on ai.google.dev/gemini-api/docs/models with no
# deprecation notice, which is misleading: it remains available to projects
# that already used it, and is closed to new ones. This project is new, so it
# is closed to us. Confirmed it is not a wrong-endpoint mistake — it 404s on
# BOTH v1beta and v1, against this project's own key:
#
#   gemini-2.5-flash        404 v1beta   404 v1
#   gemini-3.8-flash        200          200
#   gemini-3.7-flash        200          200
#   gemini-3.6-flash        200          200
#   gemini-3.5-flash        200          200
#   gemini-3.5-flash-lite   200          200
#   gemini-3.1-flash-lite   200          200
#   gemini-flash-latest     200          404   (alias exists on v1beta only)
#
# WHY THE ALIASES NOW USE DIFFERENT MODELS
# They all used to name one model, so the alias split bought nothing. Measured
# on 2026-09-07, same prompt (a real SME delivery question), same key:
#
#   model                    latency    $/1k messages
#   gemini-3.8-flash          3434ms    0.188
#   gemini-3.6-flash          3032ms    0.136
#   gemini-3.5-flash-lite      794ms    0.093
#   gemini-3.1-flash-lite     1152ms    0.086
#
# flash-lite answered a routine question in a QUARTER of the time for HALF the
# money. On WhatsApp that gap is the difference between a reply that feels
# instant and one that feels broken, and routine replies are almost all of the
# traffic. So the chatty, high-volume aliases take flash-lite, and the ones
# that actually need headroom — tool-calling, PDPA-sensitive work, images —
# take 3.8 Flash:
#
#   ai://fast       flash-lite   short replies, the bulk of all traffic
#   ai://extract    flash-lite   structured JSON, no prose judgement needed
#   ai://helpdesk   flash-lite   in-product support widget
#   ai://reasoning  3.8 Flash    agent loop + tool calling
#   ai://private    3.8 Flash    PDPA-sensitive
#   ai://vision     3.8 Flash    multimodal; lite is NOT verified for images
#
# Quality caveat, stated because it is a real trade: in the measured run
# gemini-3.5-flash-lite produced "we delivery to PJ" — a grammar slip 3.8 Flash
# did not make. For Manglish product voice that is close to harmless, but if
# reply quality regresses, ai://fast is the first line to move back.
#
# RETIREMENT IS A HARD 404, not a degradation, and pytest does not run in CI —
# so the first thing to notice is a customer getting silence. If you pin a
# dated model, put a calendar reminder against it. `gemini-flash-latest` never
# retires but drifts across versions with different pricing, which makes the
# cost table below wrong instead; that is the trade, pick deliberately.
#
# The OpenRouter fallbacks still say "google/gemini-2.5-flash". NOT VERIFIED —
# no OpenRouter key was available to test whether it still serves that model.
#
# GEMINI IS DEAD (2026-09-26, owner decision): every Gemini key is revoked. The
# notes above are history. Every STANDARD alias now leads with MiniMax-M3 and the
# native `gemini` entries were removed from their chains, so a dead key costs no
# round-trip. `google_openai` entries remain but only help if a SEPARATE
# GOOGLE_AI_STUDIO_KEY is set (by default it reuses the dead Gemini key).
# ai://private is deliberately UNCHANGED: MiniMax is not strict-privacy, so that
# alias has NO working provider until OPENAI_API_KEY (or another strict provider)
# is configured — it refuses rather than leaks. To bring Gemini back, re-add a
# `provider: gemini` entry; no code change needed.
#
aliases:

  # ---------------------------------------------------------------------------
  # ai://fast — routine replies, low temperature, the default for most user
  # chat turns. Cheap and quick. NOT for tool calling or PDPA-sensitive data.
  # ---------------------------------------------------------------------------
  ai://fast:
    description: "Default chat replies — short, friendly, low-latency."
    primary:
      provider: minimax
      model: "MiniMax-M3"
      max_output_tokens: 512
      temperature: 0.7
      # Thinking OFF (2026-09-26). Same 5 short WhatsApp questions, same key:
      #   MiniMax-M3 thinking on    p50 1403ms  p50 127 output tokens
      #   MiniMax-M3 thinking off   p50  663ms  p50  36 output tokens
      #   MiniMax-M2.7-highspeed    p50 2904ms  (M2.x cannot disable thinking)
      #   M2-her                    p50 1487ms
      # Reply quality was equivalent (every variant sometimes invents details
      # absent from the prompt). Delete this line to turn thinking back on.
      # ai://reasoning deliberately keeps thinking.
      thinking: {type: disabled}
    fallbacks:
      - provider: vercel
        model: "google/gemini-2.5-flash"
        max_output_tokens: 512
        temperature: 0.7
      - provider: google_openai
        model: "gemini-2.5-flash"
        max_output_tokens: 512
        temperature: 0.7
      - provider: openrouter
        # :free roster is volatile — verify live via GET /api/v1/models (pricing.prompt==0)
        model: "openrouter/free"   # OpenRouter free router (owner: free only); old :free ids retired 2026-09
        max_output_tokens: 512
        temperature: 0.7
      - provider: cloudflare
        model: "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
        max_output_tokens: 512
        temperature: 0.7
      - provider: openai_compatible
        model: "gpt-4o-mini"
        max_output_tokens: 512
        temperature: 0.7
    privacy: standard
    daily_budget_usd: 25.00
    per_tenant_daily_budget_usd: 5.00

  # ---------------------------------------------------------------------------
  # ai://reasoning — for tool-calling (agent loop, calendar booking, escalation)
  # and complex KB lookups. Higher max_tokens, slightly higher temperature for
  # creative tool selection.
  # ---------------------------------------------------------------------------
  ai://reasoning:
    description: "Agent loop + tool-calling + complex KB retrieval."
    primary:
      # Tool-calling chain — every entry supports the OpenAI `tools` format.
      # MiniMax-M3 is purpose-built for agentic tool use, so it leads.
      provider: minimax
      model: "MiniMax-M3"
      max_output_tokens: 2048
      temperature: 0.7
    fallbacks:
      - provider: vercel
        model: "openai/gpt-4o-mini"
        max_output_tokens: 2048
        temperature: 0.7
      - provider: openrouter
        model: "openrouter/free"   # OpenRouter free router (owner: free only); old :free ids retired 2026-09
        max_output_tokens: 2048
        temperature: 0.7
      - provider: cloudflare
        model: "@cf/meta/llama-3.3-70b-instruct-fp8-fast"   # supports function calling
        max_output_tokens: 2048
        temperature: 0.7
      - provider: openai_compatible
        model: "gpt-4o-mini"
        max_output_tokens: 2048
        temperature: 0.7
    privacy: standard
    daily_budget_usd: 50.00
    per_tenant_daily_budget_usd: 10.00

  # ---------------------------------------------------------------------------
  # ai://extract — for structured JSON extraction (handover detection, lead
  # analysis, emotion tagging). Low max_tokens, very low temperature for
  # determinism. Output is parsed as JSON.
  # ---------------------------------------------------------------------------
  ai://extract:
    description: "Structured JSON extraction — handover, leads, emotion."
    primary:
      # Structured JSON — MiniMax-M3 supports response_format/JSON schema.
      # (Vercel's Jev decision-model is a future pilot for THIS alias — it does
      #  classify/route/score far cheaper, but is TS-SDK-only today; see AI_GATEWAY docs.)
      provider: minimax
      model: "MiniMax-M3"
      max_output_tokens: 256
      temperature: 0.2
    fallbacks:
      - provider: google_openai
        model: "gemini-2.5-flash-lite"
        max_output_tokens: 256
        temperature: 0.2
      - provider: openrouter
        model: "openrouter/free"   # OpenRouter free router (owner: free only); old :free ids retired 2026-09
        max_output_tokens: 256
        temperature: 0.2
      - provider: openai_compatible
        model: "gpt-4o-mini"
        max_output_tokens: 256
        temperature: 0.2
    privacy: standard
    daily_budget_usd: 10.00
    per_tenant_daily_budget_usd: 2.00

  # ---------------------------------------------------------------------------
  # ai://private — PDPA-sensitive. Customer PII, account numbers, contact
  # details. MUST NOT fall back to OpenRouter (logs on their side) or any
  # free-pool aggregator. Only paid-direct providers we control are allowed.
  # If no strict provider has a key set, the alias returns an error — better
  # to refuse than to leak.
  # ---------------------------------------------------------------------------
  ai://private:
    description: "PDPA-sensitive — customer PII. Strict-only providers."
    primary:
      provider: gemini
      model: gemini-3.8-flash
      max_output_tokens: 1024
      temperature: 0.3
    fallbacks:
      - provider: openai_compatible
        model: "gpt-4o-mini"
        max_output_tokens: 1024
        temperature: 0.3
    privacy: strict
    daily_budget_usd: 20.00
    per_tenant_daily_budget_usd: 4.00

  # ---------------------------------------------------------------------------
  # ai://helpdesk — for /api/help/chat (in-product support widget). Low
  # temperature, short replies, no tool calling. Smaller budget since it's
  # a side-channel that should not eat into the main conversation budget.
  # ---------------------------------------------------------------------------
  ai://helpdesk:
    description: "In-product /api/help/chat support widget."
    primary:
      provider: minimax
      model: "MiniMax-M3"
      max_output_tokens: 512
      temperature: 0.4
    fallbacks:
      - provider: google_openai
        model: "gemini-2.5-flash"
        max_output_tokens: 512
        temperature: 0.4
      - provider: openrouter
        model: "openrouter/free"   # OpenRouter free router (owner: free only); old :free ids retired 2026-09
        max_output_tokens: 512
        temperature: 0.4
      - provider: openai_compatible
        model: "gpt-4o-mini"
        max_output_tokens: 512
        temperature: 0.4
    privacy: standard
    daily_budget_usd: 5.00
    per_tenant_daily_budget_usd: 1.00

  # ---------------------------------------------------------------------------
  # ai://vision — for image / document understanding (vision + multimodal).
  # Uses a vision-capable primary; falls back to text-only if needed (the
  # caller is expected to degrade gracefully on the no-vision path).
  # ---------------------------------------------------------------------------
  ai://vision:
    description: "Vision + multimodal — image / document understanding."
    primary:
      # Vision-capable only — every fallback accepts image input.
      # MiniMax-M3 is natively multimodal (image + video).
      provider: minimax
      model: "MiniMax-M3"
      max_output_tokens: 1024
      temperature: 0.3
    fallbacks:
      - provider: google_openai
        model: "gemini-2.5-flash"
        max_output_tokens: 1024
        temperature: 0.3
      - provider: openrouter
        model: "openrouter/free"   # OpenRouter free router (owner: free only); old :free ids retired 2026-09
        max_output_tokens: 1024
        temperature: 0.3
      - provider: cloudflare
        model: "@cf/meta/llama-3.2-11b-vision-instruct"
        max_output_tokens: 1024
        temperature: 0.3
    privacy: standard
    daily_budget_usd: 10.00
    per_tenant_daily_budget_usd: 2.00

# =============================================================================
# Provider configuration
# -----------------------------------------------------------------------------
# Each provider lists the env var names that hold its API key. The gateway
# gracefully degrades if any key is missing — the provider just becomes
# unavailable. Multiple env-var aliases (separated by `|`) are tried in order
# for backwards compatibility.
# =============================================================================
providers:
  gemini:
    type: gemini
    env_keys: "GEMINI_API_KEYS|GEMINI_API_KEY|GOOGLE_API_KEY"
    base_url: "https://generativelanguage.googleapis.com"

  openai_compatible:
    type: openai_compatible
    env_keys: "OPENAI_API_KEY"
    base_url: "https://api.openai.com/v1"
    # A second base_url is checked when the first 401/403s (cheap, paid-direct).

  openrouter:
    type: openai_compatible
    env_keys: "OPENROUTER_API_KEY"
    base_url: "https://openrouter.ai/api/v1"
    # OpenRouter is a multi-tenant aggregator. NOT in strict-privacy allow-list.
    # If OPENROUTER_API_KEY is unset, all openrouter fallback entries log
    # "no fallback available" and the alias skips them.

  minimax:
    # MiniMax — MiniMax-M3 flagship: 1M context, agentic tool-calling, native
    # multimodal (image+video) input, OpenAI-compatible at /v1 (standard `openai`
    # SDK works; no /models discovery; Bearer auth). Verified against
    # platform.minimax.io docs 2026-09-21. GLOBAL host below; the mainland host
    # is https://api.minimaxi.com/v1 (note the extra "i") and keys are NOT
    # interchangeable across regions. Also serves an Anthropic-compatible base at
    # https://api.minimax.io/anthropic. NOT strict-privacy (China-HQ third party).
    type: openai_compatible
    env_keys: "MINIMAX_API_KEY"
    base_url: "https://api.minimax.io/v1"

  google_openai:
    # Google AI Studio via its OpenAI-COMPATIBLE endpoint (distinct shape from the
    # native `gemini` provider above). FREE tier exists but free-tier prompts CAN
    # be used by Google for training — so this is NOT strict-privacy safe. By
    # default it reuses GEMINI_API_KEY, which means it does NOT help when that key
    # is *suspended* (same key → same 403). Set a SEPARATE free key in
    # GOOGLE_AI_STUDIO_KEY for this to add real rotation value. (docs 2026-09-21)
    type: openai_compatible
    env_keys: "GOOGLE_AI_STUDIO_KEY|GEMINI_API_KEY_FREE|GEMINI_API_KEY"
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai"

  cloudflare:
    # Cloudflare Workers AI, OpenAI-compatible. 10,000 neurons/day free. The
    # account id is baked into the URL path, so base_url uses ${CLOUDFLARE_ACCOUNT_ID}
    # (expanded from env at call time). Requires BOTH CLOUDFLARE_API_TOKEN and
    # CLOUDFLARE_ACCOUNT_ID. Free, rate-limited — a safety-net fallback, not primary.
    type: openai_compatible
    env_keys: "CLOUDFLARE_API_TOKEN"
    base_url: "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/v1"

  vercel:
    # Vercel AI Gateway — itself a hosted multi-provider rotator (zero markup on
    # provider prices, BYOK). One key fronts 200+ models; it does its OWN internal
    # failover, so as a single entry in our chain it is a strong catch-all. Model
    # slugs are "creator/model" (e.g. openai/gpt-4o-mini, google/gemini-2.5-flash).
    # NOT strict-privacy (external gateway logs/observability). (docs 2026-09-21)
    type: openai_compatible
    env_keys: "AI_GATEWAY_API_KEY|VERCEL_AI_GATEWAY_KEY"
    base_url: "https://ai-gateway.vercel.sh/v1"

# =============================================================================
# Cost observability — kept inline for transparency.
# llm_gateway_v2 uses cost_per_1k_input/output to log cost_usd per request.
# Numbers below are from each provider's published pricing (Aug 2026).
# Update quarterly or when a provider changes pricing.
# =============================================================================
cost_per_1k:
  # Verified against https://ai.google.dev/gemini-api/docs/pricing on 2026-09-07.
  #
  # gemini-2.5-flash is RETIRED for new projects — see the note on the aliases
  # above. Its entry is kept because the OpenRouter fallback may still serve it
  # and because old llm_usage rows reference it. Its numbers were ALSO WRONG:
  # they said $0.075/$0.30 per 1M when the real rate is $0.30/$2.50, so every
  # cost_usd this gateway has ever recorded for it understates input by 4x and
  # output by 8.3x — and the daily budget caps were enforcing against that.
  gemini/gemini-2.5-flash:
    input_usd: 0.0003     # $0.30 / 1M
    output_usd: 0.0025    # $2.50 / 1M
  # Introductory pricing THROUGH 2026-12-31. On 2027-01-01 it doubles to
  # $1.50 / $7.50 per 1M — update these two numbers then, or the caps silently
  # allow twice the spend they are meant to.
  gemini/gemini-3.6-flash:
    input_usd: 0.00075    # $0.75 / 1M
    output_usd: 0.00375   # $3.75 / 1M
  # Same published price as 3.6 Flash. Used by ai://reasoning, ai://private,
  # ai://vision.
  gemini/gemini-3.8-flash:
    input_usd: 0.00075    # $0.75 / 1M  (introductory, doubles 2027-01-01)
    output_usd: 0.00375   # $3.75 / 1M  (introductory, doubles 2027-01-01)
  # Used by ai://fast, ai://extract, ai://helpdesk — the high-volume aliases.
  gemini/gemini-3.5-flash-lite:
    input_usd: 0.0003     # $0.30 / 1M
    output_usd: 0.0025    # $2.50 / 1M
  gemini/gemini-3.1-flash-lite:
    input_usd: 0.0003     # $0.30 / 1M
    output_usd: 0.0025    # $2.50 / 1M
  # Not routed to; kept so switching an alias to it is a one-line change.
  gemini/gemini-flash-lite-latest:
    input_usd: 0.0003     # $0.30 / 1M
    output_usd: 0.0025    # $2.50 / 1M
  openai_compatible/gpt-4o-mini:
    input_usd: 0.00015
    output_usd: 0.0006
  openrouter/google/gemini-2.5-flash:
    input_usd: 0.0001
    output_usd: 0.0004
  minimax/MiniMax-M2.7:
    input_usd: 0.0002
    output_usd: 0.0008
  minimax/MiniMax-M2.5:
    input_usd: 0.0001
    output_usd: 0.0004
  minimax/MiniMax-M3:
    input_usd: 0.0003
    output_usd: 0.0012
