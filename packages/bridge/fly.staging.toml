# =============================================================================
# Fly.io Staging Configuration for WhatsApp Bridge
# =============================================================================
# Created: 2025-01-26
# Purpose: Separate staging bridge for Bijou staging environment tests
# App: whatsapp-bridge-staging-w3j
# Region: sjc (San Jose, California)
# =============================================================================

app = "whatsapp-bridge-staging-w3j"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  ENVIRONMENT = "staging"
  # Staging bridge → Staging Bijou (NOT production!)
  BIJOU_WEBHOOK_URL = "https://bijou-staging.fly.dev/webhook/message"
  ENABLE_HISTORY_SYNC = "false"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

[[mounts]]
  source = "whatsapp_staging_data"
  destination = "/app/store"
  initial_size = "1gb"

# =============================================================================
# Notes:
# - This is SEPARATE from production bridge (whatsapp-bridge-w3j)
# - Points to staging Bijou webhook
# - Use with STAGING WhatsApp number only
# - Isolated storage volume (whatsapp_staging_data)
# =============================================================================
