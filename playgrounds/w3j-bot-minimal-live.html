<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>W3J-Bot — Live (Minimal · Streaming · Audio)</title>
<style>
  :root {
    /* === W3J brand tokens, locked === */
    --bg: oklch(0.145 0 0);
    --surface: oklch(0.18 0 0);
    --border: oklch(0.30 0 0);
    --hairline: oklch(0.22 0 0);
    --text: oklch(0.985 0 0);
    --muted: oklch(0.65 0 0);
    --dim: oklch(0.45 0 0);

    /* === Signal palette — green primary, subtle purple accent === */
    --signal: #34d399;
    --signal-soft: rgba(52, 211, 153, 0.08);
    --signal-glow: rgba(52, 211, 153, 0.25);
    --accent: #a78bfa;          /* subtle purple — the "little bit" of purple */
    --accent-soft: rgba(167, 139, 250, 0.08);
    --accent-glow: rgba(167, 139, 250, 0.20);

    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Roboto Mono", monospace;
    --serif: "Iowan Old Style", "Apple Garamond", Baskerville, "Times New Roman", Georgia, serif;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: var(--sans);
    font-size: 14px;
    color: var(--text);
    background: var(--bg);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* Subtle purple vignette — top-right corner, like a soft glow */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 800px 500px at 100% 0%, var(--accent-soft), transparent 60%),
      radial-gradient(ellipse 600px 400px at 0% 100%, var(--signal-soft), transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  /* === Theme: Purple-leaning === */
  body[data-theme="purple"] {
    --signal: #a78bfa;
    --signal-soft: rgba(167, 139, 250, 0.08);
    --signal-glow: rgba(167, 139, 250, 0.25);
    --accent: #34d399;
    --accent-soft: rgba(52, 211, 153, 0.08);
    --accent-glow: rgba(52, 211, 153, 0.20);
  }
  body[data-theme="purple"]::before {
    background:
      radial-gradient(ellipse 800px 500px at 100% 0%, var(--signal-soft), transparent 60%),
      radial-gradient(ellipse 600px 400px at 0% 100%, var(--accent-soft), transparent 60%);
  }
  body[data-theme="mixed"]::before {
    background:
      radial-gradient(ellipse 700px 500px at 100% 0%, var(--accent-soft), transparent 60%),
      radial-gradient(ellipse 500px 400px at 0% 0%, var(--signal-soft), transparent 60%),
      radial-gradient(ellipse 600px 400px at 50% 100%, var(--accent-soft), transparent 60%);
  }

  .app {
    position: relative; z-index: 1;
    display: grid;
    grid-template-rows: 1fr 110px;
    height: 100vh;
  }

  main {
    display: grid;
    grid-template-columns: 280px 1fr;
    min-height: 0;
  }

  /* === CONTROLS — minimal, only the essential levers === */
  .controls {
    background: oklch(0.10 0 0);
    border-right: 1px solid var(--hairline);
    overflow-y: auto;
    padding: 20px 16px;
  }
  .controls::-webkit-scrollbar { width: 4px; }
  .controls::-webkit-scrollbar-thumb { background: var(--border); }

  .brand-mark {
    font-family: var(--serif);
    font-size: 22px;
    line-height: 1.1;
    color: var(--text);
    margin-bottom: 4px;
    letter-spacing: -0.01em;
  }
  .brand-mark em { font-style: italic; color: var(--signal); }
  .brand-sub {
    font-family: var(--mono);
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.25em;
    color: var(--dim);
    margin-bottom: 24px;
  }

  .ctrl-section {
    margin-bottom: 18px;
  }
  .ctrl-label {
    font-family: var(--mono);
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.25em;
    color: var(--dim);
    margin-bottom: 6px;
  }
  .ctrl-segs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
  }
  .ctrl-segs.three { grid-template-columns: 1fr 1fr 1fr; }
  .ctrl-segs.one { grid-template-columns: 1fr; }
  .seg {
    background: transparent;
    border: 1px solid var(--hairline);
    color: var(--muted);
    border-radius: 2px;
    padding: 7px 8px;
    font-size: 10px;
    font-family: var(--mono);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
  }
  .seg:hover { color: var(--text); border-color: var(--border); }
  .seg.active {
    background: var(--signal-soft);
    color: var(--signal);
    border-color: var(--signal);
  }

  /* === PREVIEW === */
  .preview {
    background: transparent;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }
  .preview-frame {
    flex: 1;
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
    padding: 32px 24px 0;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  /* === SLIM HEADER === */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 4px 0 24px;
  }
  .topbar .name {
    font-family: var(--serif);
    font-size: 20px;
    letter-spacing: -0.01em;
    color: var(--text);
  }
  .topbar .name em { font-style: italic; color: var(--signal); }
  .topbar .meta {
    display: flex; align-items: center; gap: 12px;
    font-family: var(--mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: var(--muted);
  }
  .live-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--signal);
    box-shadow: 0 0 6px var(--signal-glow);
    animation: livePulse 1.5s ease-in-out infinite;
  }
  @keyframes livePulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  .topbar .mode-toggle {
    display: flex;
    background: transparent;
    border: 1px solid var(--hairline);
    margin-left: 8px;
  }
  .topbar .mode-toggle button {
    background: transparent; border: none;
    color: var(--muted);
    padding: 4px 10px;
    font-family: var(--mono);
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    cursor: pointer;
  }
  .topbar .mode-toggle button.active {
    color: var(--signal);
    background: var(--signal-soft);
  }

  /* === CHAT STREAM === */
  .stream {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    padding: 8px 0 16px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  /* Every message: same structure, same left edge, regardless of role. */
  .msg {
    display: block;
    padding: 0;
    margin-bottom: 32px;
  }
  .msg:last-child { margin-bottom: 0; }

  /* Meta line: same format for every message — ROLE · TIME · STATE */
  .msg-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: var(--dim);
    margin: 0 0 12px 0;
    line-height: 1;
  }
  .msg-meta .role { color: var(--signal); font-weight: 500; }
  .msg[data-role="user"] .msg-meta .role { color: var(--muted); }
  .msg-meta .sep { color: var(--dim); }
  .msg-meta .state { color: var(--signal); }
  .msg-meta .state.idle { color: var(--dim); }
  .msg-meta .state.thinking { color: var(--accent); }

  /* Audio row — own line, NEVER inside the body. Same left edge as everything else. */
  .msg-audio {
    display: flex;
    align-items: center;
    gap: 2px;
    height: 16px;
    margin: 0 0 12px 0;
    line-height: 1;
  }
  .msg[data-role="user"] .msg-audio { display: none; }
  .msg-audio span {
    width: 2px;
    background: var(--signal);
    border-radius: 1px;
    animation: audioBar 0.7s ease-in-out infinite;
    opacity: 0.7;
  }
  .msg-audio span:nth-child(odd) { background: var(--accent); opacity: 0.5; }
  .msg-audio span:nth-child(1) { animation-delay: 0s; }
  .msg-audio span:nth-child(2) { animation-delay: 0.1s; }
  .msg-audio span:nth-child(3) { animation-delay: 0.2s; }
  .msg-audio span:nth-child(4) { animation-delay: 0.3s; }
  .msg-audio span:nth-child(5) { animation-delay: 0.4s; }
  .msg-audio span:nth-child(6) { animation-delay: 0.15s; }
  .msg-audio span:nth-child(7) { animation-delay: 0.25s; }
  .msg-audio span:nth-child(8) { animation-delay: 0.35s; }
  .msg-audio span:nth-child(9) { animation-delay: 0.05s; }
  .msg-audio span:nth-child(10) { animation-delay: 0.45s; }
  @keyframes audioBar { 0%, 100% { height: 3px; } 50% { height: 14px; } }

  /* Body — the actual text. No inline elements, no shifting, no exceptions.
     EVERY message uses the same 19px serif, same line-height, same max-width.
     User and agent differ ONLY in color — never in size, font, or weight. */
  .msg-body {
    font-family: var(--serif);
    font-size: 19px;
    line-height: 1.6;
    color: var(--text);
    letter-spacing: -0.005em;
    max-width: 640px;
    margin: 0;
    padding: 0;
    text-align: left;
    font-weight: 400;
  }
  .msg[data-role="user"] .msg-body {
    color: var(--muted);
    font-family: var(--serif);
    font-size: 19px;
    line-height: 1.6;
    font-weight: 400;
  }

  /* Streaming cursor — at the very end of the body, never shifts layout */
  .stream-cursor {
    display: inline-block;
    width: 2px;
    height: 0.95em;
    background: var(--signal);
    margin-left: 2px;
    vertical-align: -0.15em;
    box-shadow: 0 0 6px var(--signal-glow);
    animation: cursorBlink 0.9s steps(2) infinite;
  }
  @keyframes cursorBlink { 50% { opacity: 0.2; } }

  /* Tool call — minimal */
  .tool-chip {
    align-self: flex-start;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: var(--mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--muted);
    padding: 4px 0;
  }
  .tool-chip .name { color: var(--accent); }
  .tool-chip .arrow { color: var(--dim); }
  .tool-chip .result { color: var(--text); }
  .tool-chip .ms { color: var(--dim); }

  /* === INPUT === */
  .input-bar {
    border-top: 1px solid var(--hairline);
    padding: 16px 24px 20px;
    background: oklch(0.10 0 0);
  }
  .input-row {
    max-width: 820px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .input-box {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text);
    font-family: var(--serif);
    font-size: 18px;
    padding: 8px 0;
    letter-spacing: -0.005em;
  }
  .input-box::placeholder { color: var(--dim); font-style: italic; }
  .input-box:focus { outline: none; }
  .input-icon {
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    background: transparent;
    border: 1px solid var(--hairline);
    border-radius: 50%;
    color: var(--muted);
    cursor: pointer;
    font-family: var(--mono);
    font-size: 13px;
  }
  .input-icon:hover { border-color: var(--signal); color: var(--signal); }
  .input-icon.mic.listening {
    background: var(--signal); color: oklch(0.06 0 0);
    border-color: var(--signal);
    animation: micPulse 1.2s ease-in-out infinite;
  }
  @keyframes micPulse { 0%, 100% { box-shadow: 0 0 0 0 var(--signal-glow); } 50% { box-shadow: 0 0 0 6px transparent; } }
  .input-icon.send {
    background: var(--signal);
    color: oklch(0.06 0 0);
    border-color: var(--signal);
    font-weight: 600;
  }
  .input-icon.send:hover { background: oklch(0.85 0.13 165); }

  .input-hint {
    max-width: 820px;
    margin: 4px auto 0;
    font-family: var(--mono);
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: var(--dim);
    display: flex; gap: 12px;
  }
  .input-hint .pill {
    border: 1px solid var(--hairline);
    padding: 3px 8px;
    border-radius: 12px;
    cursor: pointer;
    color: var(--muted);
  }
  .input-hint .pill:hover { border-color: var(--signal); color: var(--signal); }

  /* === TALK MODE — full-bleed voice === */
  .talk-mode {
    display: none;
    position: absolute; inset: 0;
    background: oklch(0.05 0 0);
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px;
    z-index: 10;
  }
  .preview[data-mode="talk"] .talk-mode { display: flex; }
  .preview[data-mode="talk"] .type-mode { display: none; }

  .talk-orb {
    width: 160px; height: 160px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, var(--signal), oklch(0.06 0 0) 70%);
    box-shadow: 0 0 80px var(--signal-glow), 0 0 120px var(--accent-glow);
    position: relative;
    margin-bottom: 40px;
    animation: orbFloat 4s ease-in-out infinite;
  }
  .preview[data-agent="speaking"] .talk-orb {
    background: radial-gradient(circle at 30% 30%, var(--signal), oklch(0.06 0 0) 70%);
    animation: orbSpeak 0.7s ease-in-out infinite alternate;
  }
  .preview[data-agent="thinking"] .talk-orb {
    background: radial-gradient(circle at 30% 30%, var(--accent), oklch(0.06 0 0) 70%);
    box-shadow: 0 0 80px var(--accent-glow);
    animation: orbSpin 3s linear infinite;
  }
  .preview[data-agent="listening"] .talk-orb {
    background: radial-gradient(circle at 30% 30%, var(--signal), oklch(0.06 0 0) 70%);
    animation: orbListen 1.4s ease-in-out infinite;
  }
  @keyframes orbFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  @keyframes orbSpeak { from { transform: scale(1); } to { transform: scale(1.06); } }
  @keyframes orbSpin { to { transform: rotate(360deg); } }
  @keyframes orbListen { 0%, 100% { box-shadow: 0 0 80px var(--signal-glow); } 50% { box-shadow: 0 0 120px var(--signal), 0 0 160px var(--accent-glow); } }

  .talk-orb::before, .talk-orb::after {
    content: ''; position: absolute; inset: -16px;
    border: 1px solid var(--signal);
    border-radius: 50%;
    opacity: 0.2;
  }
  .talk-orb::after { inset: -32px; opacity: 0.1; border-color: var(--accent); }

  .talk-state {
    font-family: var(--mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.3em;
    color: var(--signal);
    margin-bottom: 24px;
  }
  .talk-transcript {
    font-family: var(--serif);
    font-style: italic;
    font-size: 22px;
    line-height: 1.5;
    color: var(--text);
    text-align: center;
    max-width: 600px;
    min-height: 66px;
  }
  .talk-transcript .cursor {
    display: inline-block;
    width: 2px; height: 1em;
    background: var(--signal);
    vertical-align: -0.15em;
    margin-left: 2px;
    animation: cursorBlink 0.9s steps(2) infinite;
  }
  .talk-end {
    margin-top: 48px;
    background: transparent;
    border: 1px solid var(--hairline);
    color: var(--muted);
    padding: 8px 20px;
    font-family: var(--mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.25em;
    cursor: pointer;
    border-radius: 20px;
  }
  .talk-end:hover { border-color: var(--text); color: var(--text); }

  /* === PROMPT BAR === */
  .prompt-bar {
    background: oklch(0.08 0 0);
    border-top: 1px solid var(--hairline);
    padding: 10px 16px;
    display: flex; flex-direction: column;
    gap: 6px;
  }
  .prompt-label {
    font-family: var(--mono);
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.25em;
    color: var(--dim);
    display: flex; justify-content: space-between; align-items: center;
  }
  .prompt-text {
    background: var(--bg);
    border: 1px solid var(--hairline);
    border-radius: 2px;
    padding: 8px 12px;
    color: var(--text);
    font-size: 11px;
    line-height: 1.5;
    font-family: var(--mono);
    flex: 1;
    overflow-y: auto;
    white-space: pre-wrap;
  }
  .copy-btn {
    background: var(--signal);
    color: oklch(0.06 0 0);
    border: none;
    border-radius: 2px;
    padding: 4px 10px;
    font-size: 9px;
    font-weight: 700;
    cursor: pointer;
    font-family: var(--mono);
    text-transform: uppercase;
    letter-spacing: 0.15em;
  }
</style>
</head>
<body>
<div class="app">
  <main>
    <aside class="controls">
      <div class="brand-mark"><em>W3J</em>-Bot</div>
      <div class="brand-sub">LIVE · STREAMING · AUDIO</div>

      <div class="ctrl-section">
        <div class="ctrl-label">Mode</div>
        <div class="ctrl-segs" id="modeGroup"></div>
      </div>

      <div class="ctrl-section">
        <div class="ctrl-label">Streaming</div>
        <div class="ctrl-segs" id="streamGroup"></div>
      </div>

      <div class="ctrl-section">
        <div class="ctrl-label">Voice</div>
        <div class="ctrl-segs" id="voiceGroup"></div>
      </div>

      <div class="ctrl-section">
        <div class="ctrl-label">Audio Visualizer</div>
        <div class="ctrl-segs" id="visualGroup"></div>
      </div>

      <div class="ctrl-section">
        <div class="ctrl-label">Agent State</div>
        <div class="ctrl-segs three" id="stateGroup"></div>
      </div>

      <div class="ctrl-section">
        <div class="ctrl-label">Type Speed</div>
        <div class="ctrl-segs" id="speedGroup"></div>
      </div>

      <div class="ctrl-section">
        <div class="ctrl-label">Theme</div>
        <div class="ctrl-segs" id="themeGroup"></div>
      </div>
    </aside>

    <section class="preview" id="preview" data-mode="type" data-agent="speaking">
      <div class="preview-frame type-mode">
        <div class="topbar">
          <div class="name"><em>W3J</em>-Bot</div>
          <div class="meta">
            <span class="live-dot"></span>
            <span id="statusText">LIVE</span>
            <span style="color: var(--dim);">·</span>
            <span id="timeText">00:42</span>
            <div class="mode-toggle">
              <button data-set-mode="type" class="active">Type</button>
              <button data-set-mode="talk">Talk</button>
            </div>
          </div>
        </div>

        <div class="stream" id="stream">
          <!-- Rendered by JS -->
        </div>
      </div>

      <div class="talk-mode">
        <div class="talk-orb"></div>
        <div class="talk-state" id="talkState">LISTENING</div>
        <div class="talk-transcript" id="talkTranscript">
          Try saying something like <span style="color: var(--accent); font-style: italic;">"what's Bijou AI?"</span><span class="cursor"></span>
        </div>
        <button class="talk-end">End call</button>
      </div>
    </section>
  </main>

  <footer class="input-bar type-mode">
    <div class="input-row">
      <button class="input-icon" title="Attach">+</button>
      <input class="input-box" placeholder="Ask W3J-Bot anything…" />
      <button class="input-icon mic" id="micBtn" title="Toggle voice">●</button>
      <button class="input-icon send" title="Send">→</button>
    </div>
    <div class="input-hint">
      <span class="pill" data-try>What does Bijou AI do?</span>
      <span class="pill" data-try>Cut my AI bill</span>
      <span class="pill" data-try>Default stack</span>
    </div>
  </footer>

  <footer class="prompt-bar">
    <div class="prompt-label">
      <span>Build prompt — paste to Mavis</span>
      <button class="copy-btn" id="copy">Copy</button>
    </div>
    <div class="prompt-text" id="prompt"></div>
  </footer>
</div>

<script>
const DEFAULTS = {
  mode: 'type',
  stream: 'textwave',
  voice: 'off',
  visual: 'inline',
  agentState: 'speaking',
  speed: 'normal',
  theme: 'green',
};

const state = { ...DEFAULTS };

const CONTROL_DEFS = [
  { id: 'modeGroup', name: 'mode', options: [['type','Type'],['talk','Talk']] },
  { id: 'streamGroup', name: 'stream', options: [['text','Text'],['textwave','Text+Wave'],['audio','Audio'],['agentic','Agentic']] },
  { id: 'voiceGroup', name: 'voice', options: [['off','Off'],['on','On']] },
  { id: 'visualGroup', name: 'visual', options: [['inline','Inline'],['subtle','Subtle'],['hidden','Hidden']] },
  { id: 'stateGroup', name: 'agentState', options: [['idle','Idle'],['thinking','Think'],['speaking','Speak'],['listening','Listen']] },
  { id: 'speedGroup', name: 'speed', options: [['slow','Slow'],['normal','Normal'],['fast','Fast'],['instant','Instant']] },
  { id: 'themeGroup', name: 'theme', options: [['green','Green'],['purple','Purple'],['mixed','Mixed']] },
];

CONTROL_DEFS.forEach(cd => {
  const root = document.getElementById(cd.id);
  cd.options.forEach(([val, lbl]) => {
    const b = document.createElement('button');
    b.className = 'seg';
    b.dataset.name = cd.name;
    b.dataset.value = val;
    b.textContent = lbl;
    b.addEventListener('click', () => {
      state[cd.name] = val;
      updateAll();
    });
    root.appendChild(b);
  });
});

// Mode toggle in topbar
document.querySelectorAll('[data-set-mode]').forEach(b => {
  b.addEventListener('click', () => {
    state.mode = b.dataset.setMode;
    updateAll();
  });
});

// Copy
document.getElementById('copy').addEventListener('click', () => {
  const txt = document.getElementById('prompt').textContent;
  navigator.clipboard.writeText(txt).then(() => {
    const btn = document.getElementById('copy');
    btn.textContent = 'Copied';
    setTimeout(() => { btn.textContent = 'Copy'; }, 1500);
  });
});

// === RENDERING ===

const fullText = "Three threads. Bijou AI — a WhatsApp concierge for Malaysian SMEs, live in fifteen minutes. The W3J-Bot portfolio assistant you're talking to right now. And the brand-evolution system that takes a URL and rebuilds a brand for any surface.";

let revealIdx = 0;
let revealTimer = null;
let currentDisplayed = '';

function startStreaming() {
  if (revealTimer) clearInterval(revealTimer);
  revealIdx = 0;
  currentDisplayed = '';
  if (state.speed === 'instant') {
    currentDisplayed = fullText;
    renderStream();
    return;
  }
  const delay = state.speed === 'slow' ? 35 : state.speed === 'fast' ? 6 : 15;
  revealTimer = setInterval(() => {
    revealIdx++;
    currentDisplayed = fullText.substring(0, revealIdx);
    renderStream();
    if (revealIdx >= fullText.length) {
      clearInterval(revealTimer);
      revealTimer = null;
    }
  }, delay);
}

function renderStream() {
  const root = document.getElementById('stream');
  if (!root.querySelector('.msg[data-role="agent"]')) {
    root.innerHTML = '';
    // Both messages use the SAME structure: meta, [audio for agent only], body
    const audioRow = state.visual === 'hidden' ? '' :
      '<div class="msg-audio"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>';

    const stateLabel = state.agentState === 'idle' ? 'idle' :
                       state.agentState === 'thinking' ? 'thinking' : 'live';

    // User message
    const u = document.createElement('div');
    u.className = 'msg';
    u.dataset.role = 'user';
    u.innerHTML = `
      <div class="msg-meta">
        <span class="role">YOU</span>
        <span class="sep">·</span>
        <span class="time">21:48:32</span>
      </div>
      <div class="msg-body">What can you tell me about your recent agent work?</div>
    `;
    root.appendChild(u);

    // Agent message — same structure, plus audio row
    const a = document.createElement('div');
    a.className = 'msg';
    a.dataset.role = 'agent';
    a.innerHTML = `
      <div class="msg-meta">
        <span class="role">W3J-BOT</span>
        <span class="sep">·</span>
        <span class="time">21:48:34</span>
        <span class="sep">·</span>
        <span class="state ${stateLabel}">${stateLabel.toUpperCase()}</span>
      </div>
      ${audioRow}
      <div class="msg-body" id="agentBody"></div>
    `;
    root.appendChild(a);
  }

  const body = document.getElementById('agentBody');
  if (!body) return;

  // Body contains ONLY text + (optional) cursor. No inline visualizer.
  let html = currentDisplayed;
  if (revealIdx < fullText.length || state.speed === 'instant') {
    if (state.visual !== 'hidden') {
      html += '<span class="stream-cursor"></span>';
    }
  }
  body.innerHTML = html;
}

function renderStatus() {
  const preview = document.getElementById('preview');
  preview.dataset.mode = state.mode;
  preview.dataset.agent = state.agentState;

  const statusText = document.getElementById('statusText');
  if (statusText) {
    if (state.mode === 'talk') {
      const map = { idle: 'STANDBY', thinking: 'PROCESSING', speaking: 'SPEAKING', listening: 'LISTENING' };
      statusText.textContent = map[state.agentState] || 'LIVE';
    } else {
      const map = { idle: 'IDLE', thinking: 'THINKING', speaking: 'LIVE', listening: 'READY' };
      statusText.textContent = map[state.agentState] || 'LIVE';
    }
  }

  const talkState = document.getElementById('talkState');
  if (talkState) {
    const map = { idle: 'STANDBY', thinking: 'PROCESSING', speaking: 'SPEAKING', listening: 'LISTENING' };
    talkState.textContent = map[state.agentState] || 'LISTENING';
  }

  // Mode toggle active
  document.querySelectorAll('[data-set-mode]').forEach(b => {
    b.classList.toggle('active', b.dataset.setMode === state.mode);
  });

  // Update the agent message's state label (in sync with header)
  const msgState = document.querySelector('.msg[data-role="agent"] .msg-meta .state');
  if (msgState) {
    const stateMap = { idle: ['IDLE', 'idle'], thinking: ['THINKING', 'thinking'], speaking: ['LIVE', 'live'], listening: ['LISTENING', 'live'] };
    const [label, cls] = stateMap[state.agentState] || ['LIVE', 'live'];
    msgState.textContent = label;
    msgState.className = 'state ' + cls;
  }

  // Theme
  document.body.dataset.theme = state.theme;
}

function applyState() {
  document.querySelectorAll('.seg').forEach(btn => {
    if (state[btn.dataset.name] === btn.dataset.value) {
      btn.classList.add('active');
    } else {
      btn.classList.remove('active');
    }
  });
  renderStatus();
  startStreaming();  // restart streaming animation on every state change
}

function updatePrompt() {
  const parts = [];

  if (state.mode === 'talk') parts.push('Talk Mode as the primary experience (full-bleed voice)');
  else parts.push('Type Mode as the primary experience');

  if (state.stream === 'textwave') parts.push('text streaming with a small inline audio visualizer');
  else if (state.stream === 'audio') parts.push('audio-first streaming');
  else if (state.stream === 'agentic') parts.push('agentic streaming');
  else if (state.stream === 'text') parts.push('plain text streaming, no inline visualizer');

  if (state.voice === 'on') parts.push('voice answers on (TTS)');
  if (state.visual === 'hidden') parts.push('inline audio visualizer hidden during streaming');
  else if (state.visual === 'subtle') parts.push('subtle inline audio visualizer');

  const stateMap = { idle: 'idle', thinking: 'processing', speaking: 'live', listening: 'listening' };
  parts.push(`default agent state: ${stateMap[state.agentState]}`);

  parts.push(`${state.speed} type speed`);

  if (state.theme === 'purple') parts.push('purple-leaning accent palette');
  else if (state.theme === 'mixed') parts.push('mixed green + purple accent palette');

  const prompt = `Build the W3J-Bot chat component for portfolio.w3jdev.com — minimal, clean, elegant, brand-locked. ${parts.join('; ')}. Visual language: background oklch(0.145 0 0), primary signal #34d399 (mint green), subtle purple accent #a78bfa used sparingly for thinking/agentic states and odd-indexed audio bars. Off-white text oklch(0.985 0 0). The agent name uses a serif (Iowan Old Style / Apple Garamond / Baskerville) with the "W3J" in italic signal-green.

CRITICAL ALIGNMENT RULES — every message uses the SAME structure, same left edge, regardless of role:
  META line: mono, 10px, uppercase, 0.2em tracked, in the format "ROLE · TIME · STATE" with dot separators. The "·" between segments is always the dim color. User messages show "YOU · 21:48:32". Agent messages show "W3J-BOT · 21:48:34 · LIVE" (state = LIVE / IDLE / THINKING, colored signal/dim/accent respectively).
  AUDIO row (agent only, never user): a separate row of 10 thin vertical bars (2px wide, 3-14px animated height) aligned to the SAME left edge as the meta and body. Alternating signal green and subtle purple. This row is its own DOM element — NEVER inside the message body, NEVER shifting text position.
  BODY: only the actual text plus a 2px streaming cursor at the natural end. No inline elements. BOTH user and agent use the SAME 19px serif (Iowan Old Style / Apple Garamond / Baskerville), same line-height (1.6), same letter-spacing (-0.005em), same max-width (640px), same text-align (left), same font-weight (400). User and agent differ ONLY in color — user is muted (oklch(0.65 0 0)), agent is off-white (oklch(0.985 0 0)). Never differ in size, font, or weight.

Streaming text reveals live at the chosen speed (slow/normal/fast/instant) with the signal-green cursor. The page background has a soft top-right purple gradient and a bottom-left green gradient, both under 8% opacity. The input row is minimal: attach icon, italic serif placeholder, mic icon, green send arrow. In Talk Mode the chat is replaced by a full-bleed orb in the center (160px, radial green-to-black) with a pulsing state label and a live italic transcript below. The whole thing must be calm, professional, and quiet — let the live streaming animation carry the energy.`;
  document.getElementById('prompt').textContent = prompt;
}

function updateAll() {
  applyState();
  updatePrompt();
}

updateAll();
</script>
</body>
</html>
