name: secret-scan

# Scans for committed credentials. This is the half the pre-commit hook cannot
# do: the hook only ever sees one staged diff, so it cannot find a secret that
# is already in history, and it only protects people who installed it.
#
# Both credential incidents in this repo would have been caught here:
#   2026-08-10  admin API key      (docs/SECURITY_ALERT_2026-08-24_admin_key.md)
#   2026-08-29  Coolify API token  (docs/SECURITY_ALERT_2026-09-06_coolify_token.md)
# The second was queued as a follow-up by the first's post-mortem and never
# built, and the same class of incident recurred nineteen days later.
#
# NOTE: GitHub Actions on this account is billing-locked as of 2026-09-06 —
# runs fail in ~3s with "The job was not started because your account is locked
# due to a billing issue." This workflow is committed so it starts working the
# moment that clears; until then it has NOT run and must not be treated as
# passing. Run ./ops/githooks/test-secret-guard.sh locally in the meantime.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly full-history sweep. A secret can enter through a path that never
    # triggers a push event here (a force-push, an import, a merged fork).
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 0 = full history. The whole point: a shallow clone would miss
          # exactly the case that bit this repo, where the secret is in an
          # older commit rather than the tip.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  guard-self-test:
    name: pre-commit guard self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The guard is regex, and regex rots. This runs the same fixtures that
      # pin the two known regressions: the Sanctum token shape it must catch,
      # and the git-log line it must not flag.
      - name: Self-test the secret guard
        run: ./ops/githooks/test-secret-guard.sh

      # A guard nobody installs protects nobody. Fail loudly if the tracked
      # hook stops being executable.
      - name: Hook is executable
        run: test -x ops/githooks/pre-commit
