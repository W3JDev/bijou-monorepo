# nginx config for the local Supabase-compatible gateway.
#
# The cloud Supabase project serves GoTrue and PostgREST from ONE origin
# under /auth/v1 and /rest/v1. supabase-py builds its URLs that way, so the
# local stack has to present the same shape — otherwise every call site would
# need a local-only special case. This is the whole reason this file exists.

server {
    listen 8000;
    server_name _;

    # Generous, because knowledge-base uploads go through here.
    client_max_body_size 50m;

    # Plain 200 so compose can tell the gateway itself apart from its upstreams.
    location = /health {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"ok","service":"supabase-gateway-local"}';
    }


    # GoTrue builds email links from the ORIGIN of API_EXTERNAL_URL and ignores
    # its path, so a confirmation link is always <origin>/verify — never
    # /auth/v1/verify, whatever API_EXTERNAL_URL says. Setting the path there
    # does not fix it; this does. Without this route the emailed link 404s and
    # a user can never confirm their address.
    location = /verify {
        proxy_pass http://supabase-auth:9999/verify$is_args$args;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Same reasoning for the other links GoTrue mails out.
    location = /callback {
        proxy_pass http://supabase-auth:9999/callback$is_args$args;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # GoTrue — signup, login, token refresh, magic links.
    location /auth/v1/ {
        proxy_pass http://supabase-auth:9999/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # PostgREST — every .table(...) call from supabase-py lands here.
    location /rest/v1/ {
        proxy_pass http://supabase-rest:3000/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # PostgREST authenticates from the JWT in Authorization. supabase-py
        # sends apikey too; pass both straight through untouched.
        proxy_set_header Authorization     $http_authorization;
        proxy_set_header apikey            $http_apikey;
    }

    location / {
        add_header Content-Type application/json;
        return 404 '{"error":"not found","hint":"local gateway serves /auth/v1 and /rest/v1 only"}';
    }
}
